name: Skills AI CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # theory-reference is a private repository, so the default job token cannot
          # read it. CI_CHECKOUT_TOKEN is a read-only fine-grained token for skills_ai
          # and theory-reference, kept as an Actions secret; renew it before it expires.
          token: ${{ secrets.CI_CHECKOUT_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify every package and the parent
        run: python scripts/verify_all.py
